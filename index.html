button,input,textarea{font:inherit}.chalk{font-family:"Comic Sans MS","Segoe Print",cursive}.top{height:66px;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:24px;padding:0 22px;background:#050d11ee;border-bottom:1px solid #38505a;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px;min-width:290px;cursor:pointer}.bars{display:flex;gap:4px;align-items:end;height:38px}.bars i{display:block;width:10px;background:var(--yellow);border-radius:2px}.bars i:nth-child(1){height:16px;background:#ff9b27}.bars i:nth-child(2){height:27px;background:#ffb522}.bars i:nth-child(3){height:38px}.brand strong{font-size:22px;letter-spacing:.5px}.brand strong b{color:var(--yellow)}.brand small{display:block;font-size:11px;letter-spacing:1.4px}.topnav{display:flex;gap:7px;align-items:center;margin-left:auto}.topnav button{color:white;background:transparent;border:0;padding:9px 12px;cursor:pointer;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:15px}.topnav button:hover{color:var(--yellow)}.search{width:250px;border:1px solid #36505b;background:#0c1820;color:white;border-radius:8px;padding:10px 12px}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr)}aside{height:calc(100vh - 66px);position:sticky;top:66px;overflow:auto;border-right:1px solid #31454d;padding:18px 12px;background:#071116cc}.tape-title{display:inline-block;background:var(--yellow);color:#111;padding:8px 16px;font-weight:1000;transform:rotate(-3deg);box-shadow:5px 6px 0 #0007;margin:4px 8px 13px}.route{display:inline-block;margin-left:10px;font-size:13px;color:#fff;transform:rotate(2deg)}.module{display:grid;grid-template-columns:42px 38px 1fr;gap:8px;align-items:center;padding:8px 7px;margin:5px 0;border:1px solid #29404a;border-radius:10px;background:#0a171e;cursor:pointer;transition:.18s}.module:hover{transform:translateX(4px);border-color:#6a8088}.module.on{border-color:var(--yellow);box-shadow:0 0 0 1px #ffd42a55,inset 0 0 20px #ffd42a12}.num{display:grid;place-items:center;height:40px;border-radius:7px;background:#2c92bd;color:#041016;font-weight:1000;font-size:18px}.module:nth-of-type(4n+2) .num{background:#19b996}.module:nth-of-type(4n+3) .num{background:#7f55da}.module:nth-of-type(4n+4) .num{background:#e87849}.module.on .num{background:var(--yellow)}.ico{font-size:21px;text-align:center}.module b{font-size:14px}.module small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
main{padding:25px 34px 60px;max-width:1500px}.crumb{color:#a8bac1;margin:0 0 13px}.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.hero h1{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:58px;line-height:.98;margin:10px 0 12px;text-shadow:3px 4px 0 #000}.hero h1 em{color:var(--yellow);font-style:normal}.swash{display:inline;background:linear-gradient(transparent 18%,#087da4 18% 88%,transparent 88%);padding:2px 10px;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:18px}.paper{background:var(--paper);color:#141414;padding:19px 20px;box-shadow:9px 10px 0 #0006;transform:rotate(-1.5deg);position:relative;font-family:"Comic Sans MS","Segoe Print",cursive}.paper:before,.paper:after{content:"";position:absolute;width:70px;height:24px;background:#d9c69a99;top:-10px}.paper:before{left:16px;transform:rotate(-9deg)}.paper:after{right:10px;transform:rotate(8deg)}.paper h3{margin:4px 0 10px;font-size:20px}.paper p{margin:8px 0}.check{color:#00a85a;font-weight:1000}.principle{margin:22px 0;border:1px solid #8b711d;border-radius:14px;padding:17px 20px;background:#0b171ddd;box-shadow:inset 0 0 30px #0007;font-size:18px}.principle b{color:var(--yellow)}.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 13px}.tabs button{white-space:nowrap;border:1px solid #315462;background:#0e2833;color:white;padding:11px 13px;border-radius:8px;cursor:pointer;font-size:12px}.tabs button.on{background:var(--yellow);color:#111;border-color:var(--yellow);font-weight:900}.progress{height:5px;background:#142832;border-radius:9px;overflow:hidden;margin-bottom:15px}.progress i{display:block;height:100%;width:12.5%;background:linear-gradient(90deg,var(--yellow),var(--green));transition:.3s}
.board{border:1px solid #263e48;border-radius:14px;background:#08141af5;padding:22px;box-shadow:inset 0 0 45px #0008,8px 9px 0 #0003}.lesson{display:none}.lesson.on{display:block;animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(7px)}}.lesson h2{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:35px;margin:0 0 8px}.lesson h2 span{display:inline-block;background:var(--yellow);color:#111;padding:4px 10px;transform:rotate(-3deg);margin-right:10px}.lesson p{line-height:1.6;color:#dce5e7}.market-sketch{height:330px;margin:15px 0;position:relative;border-radius:10px;overflow:hidden;background:linear-gradient(#fff08 1px,transparent 1px),linear-gradient(90deg,#fff08 1px,transparent 1px);background-size:44px 44px}.market-sketch svg{width:100%;height:100%;filter:drop-shadow(0 0 5px #000)}.sticky{position:absolute;padding:10px 13px;color:#111;font-weight:1000;font-family:"Comic Sans MS","Segoe Print",cursive;box-shadow:5px 6px 0 #0007;transform:rotate(-5deg)}.pink{background:#ff5b78}.lime{background:#5ce576}.purple{background:#c46cff;color:#160a1e}.cyan{background:#49d8f4}.read-order{border:2px solid #09aeda;border-radius:12px;padding:15px 18px;margin-top:15px;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:19px}.read-order b{color:var(--cyan)}.lessonnav{display:flex;justify-content:space-between;margin-top:15px}.lessonnav button,.action{border:1px solid #35525d;background:#10242d;color:#fff;border-radius:8px;padding:10px 15px;cursor:pointer}.lessonnav button:hover,.action:hover{border-color:var(--yellow);color:var(--yellow)}
.journal{margin-top:28px}.journal-head{display:flex;justify-content:space-between;align-items:end;gap:12px}.journal h2{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:34px;margin-bottom:5px}.drop{border:2px dashed #d6b92f;border-radius:16px;padding:27px;text-align:center;background:#0a1820;cursor:pointer;transition:.2s}.drop.drag{border-color:var(--green);box-shadow:0 0 28px #18d78333;transform:scale(1.005)}.drop input{display:none}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-top:18px}.trade{background:#0b1920;border:1px solid #344b54;padding:11px;border-radius:11px;position:relative;box-shadow:7px 8px 0 #0005;transform:rotate(-.2deg)}.trade img{width:100%;height:190px;object-fit:cover;border-radius:6px}.trade textarea{width:100%;min-height:65px;background:#071116;color:white;border:1px solid #304952;border-radius:7px;padding:8px;margin-top:8px}.tag{position:absolute;top:18px;left:18px;background:var(--yellow);color:#111;padding:6px 9px;font-weight:1000;transform:rotate(-4deg);box-shadow:3px 3px 0 #0008;z-index:2}.del{position:absolute;right:17px;top:17px;z-index:3;border:0;background:#000b;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer}.stickers{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.stickers button{border:1px solid #39535e;background:#10252e;color:#fff;border-radius:20px;padding:5px 8px;cursor:pointer;font-size:11px}.privacy{color:#91a7b0;font-size:12px;margin-top:9px}.placeholder{padding:50px;text-align:center}.placeholder h2{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:42px;color:var(--yellow)}
@media(max-width:1000px){.layout{grid-template-columns:220px 1fr}.hero{grid-template-columns:1fr}.paper{display:none}.brand{min-width:200px}.search{display:none}.hero h1{font-size:46px}}@media(max-width:720px){.topnav{display:none}.layout{display:block}aside{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid #31454d}.tape-title,.route{display:none}.module{min-width:170px}.module small{display:none}main{padding:20px 14px}.hero h1{font-size:40px}.market-sketch{height:250px}}

/* interactive lesson upgrade */
.candlelab{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:16px}.labstage{min-height:300px;display:grid;place-items:center;border:1px solid #29434e;border-radius:12px;background:#071116}.bigcandle{height:230px;width:90px;position:relative;cursor:pointer}.bigcandle .wick{position:absolute;left:43px;top:10px;width:4px;height:210px;background:#18d783;border-radius:4px}.bigcandle .body{position:absolute;left:19px;top:70px;width:52px;height:105px;background:#18d783;border-radius:5px;box-shadow:0 0 22px #18d78355}.ohlc{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ohlc button{padding:12px;border:1px solid #35525d;background:#10242d;color:white;border-radius:9px;cursor:pointer}.ohlc button:hover,.ohlc button.on{border-color:var(--yellow);color:var(--yellow)}.explain{min-height:86px;padding:14px;margin-top:10px;border:2px dashed #ffd42a77;border-radius:10px;font-family:"Comic Sans MS","Segoe Print",cursive}.structureGame{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.structureGame button{padding:10px 13px;border:1px solid #35525d;background:#10242d;color:white;border-radius:20px;cursor:pointer}.structureGame button:hover{border-color:var(--cyan)}.case-note{background:#efe4c6;color:#151515;padding:16px 18px;margin:18px 0;transform:rotate(.4deg);box-shadow:7px 8px 0 #0005;font-family:"Comic Sans MS","Segoe Print",cursive}.case-note b{background:var(--yellow);padding:2px 5px}@media(max-width:850px){.candlelab{grid-template-columns:1fr}}
.candle-reading{margin-top:18px}.candle-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.candle-card{background:#0b1820;border:1px solid #34505b;border-radius:12px;padding:14px}.candle-card b{display:block;margin-bottom:6px}.candle-card.good{border-color:#25cf8b}.candle-card.warn{border-color:#ff5b64}.candle-rule{margin-top:14px;background:#efe4c6;color:#151515;padding:14px;transform:rotate(-.25deg);font-family:"Comic Sans MS","Segoe Print",cursive}@media(max-width:700px){.candle-grid{grid-template-columns:1fr}}.gloss-candles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.gc{background:#0b1820;border:1px solid #34505b;border-radius:12px;padding:14px}.gc .mini{height:82px;position:relative;margin:4px auto 12px;width:34px}.gc .mini i{position:absolute;left:16px;width:3px;background:currentColor}.gc .mini b{position:absolute;left:7px;width:21px;background:currentColor;border-radius:2px}.gc.green{color:#25cf8b}.gc.red{color:#ff5b64}.gc span{color:#fff;display:block}.gc small{color:#b8c7cc}.gc .full i{top:4px;height:74px}.gc .full b{top:16px;height:48px}.gc .lower i{top:3px;height:76px}.gc .lower b{top:9px;height:28px}.gc .upper i{top:3px;height:76px}.gc .upper b{top:47px;height:27px}.gc .doji i{top:3px;height:76px}.gc .doji b{top:38px;height:5px}.gloss-note{margin-top:16px;padding:13px;background:#efe4c6;color:#151515;transform:rotate(-.2deg)}@media(max-width:760px){.gloss-candles{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="top"><div class="brand" id="homeBtn"><div class="bars"><i></i><i></i><i></i></div><div><strong>TRADING <b>BIBLIA</b></strong><small>APRENDE A LEER EL MERCADO</small></div></div><nav class="topnav"><button data-view="home">Inicio</button><button data-view="module">Guía rápida</button><button data-view="glossary">Glosario</button><button data-view="journal">Mis operaciones</button><button data-view="notes">Mis notas</button></nav><input class="search" placeholder="⌕  Buscar en la Biblia..."></header>
<div class="layout"><aside><div><span class="tape-title chalk">MÓDULOS</span><span class="route chalk">← TU HOJA DE RUTA</span><div id="modules"></div></div></aside><main id="main"></main></div>
<script>
const mods=[["El Precio Primero","Qué está haciendo el mercado","▥"],["Volumen","La fuerza del movimiento","▥"],["MACD","Momentum","↗"],["RSI / CRSI","Lectura de momentum","⌁"],["Soporte y Resistencia","Zonas clave","↔"],["Tendencia","Dirección del mercado","↗"],["Impulso y Retroceso","Movimientos y pausas","⌁"],["Movimiento Extendido","Cuándo es mucho","↗"],["Medias Móviles","Seguimiento de tendencia","〽"],["Fibonacci","Zonas de interés","↔"],["Confluencia","Todas las piezas juntas","✣"],["Lo que el indicador NO dice","Errores comunes","✦"],["Gestión de riesgo","Protegé tu cuenta","♜"],["Plan de trading","Tu estrategia","〽"]];
const lessons=[["Qué es el precio","El precio es el resultado visible de la lucha entre compradores y vendedores. Cada vela resume lo que ocurrió durante un período; los máximos y mínimos van construyendo la estructura."],["Velas","Una vela no predice. Registra apertura, máximo, mínimo y cierre. Su valor aparece cuando la ubicás dentro de una estructura."],["Máximos y mínimos","Comparar máximos y mínimos consecutivos permite describir la estructura sin adivinar el futuro."],["Tendencia","Máximos y mínimos crecientes describen una estructura alcista; decrecientes, bajista. La estructura manda antes que el indicador."],["Rango","Cuando soporte y resistencia contienen al precio y no hay progreso direccional claro, describimos una lateralización."],["Soporte / Resistencia","Son zonas donde el precio ha mostrado reacción. Son áreas de observación, no botones automáticos de compra o venta."],["Impulso / Retroceso","El mercado alterna desplazamientos y pausas. Un retroceso no equivale por sí mismo a un cambio de tendencia."],["Movimiento extendido","Que un movimiento lleve mucho recorrido no significa que deba corregir ahora. Primero observamos evidencia de cambio."]];
function renderModules(){modules.innerHTML=mods.map((m,i)=>'<div class="module '+(i===0?'on':'')+'" data-mod="'+i+'"><div class="num">'+(i+1)+'</div><div class="ico">'+m[2]+'</div><div><b>'+m[0]+'</b><small>'+m[1]+'</small></div></div>').join("")}
function candleLab(){return '<div class="candlelab"><div class="labstage"><div class="bigcandle" id="bigcandle"><i class="wick"></i><i class="body"></i></div></div><div><h3 class="chalk">Anatomía de una vela</h3><p>Tocá cada parte. La vela registra información; no adivina la próxima.</p><div class="ohlc"><button data-ohlc="Apertura">Apertura</button><button data-ohlc="Máximo">Máximo</button><button data-ohlc="Mínimo">Mínimo</button><button data-ohlc="Cierre">Cierre</button></div><div class="explain" id="ohlcText">Elegí una parte de la vela.</div></div></div>'}
function candleReading(){return '<div class="candle-reading"><h3 class="chalk">Quién tuvo el control dentro de la vela</h3><div class="candle-grid"><div class="candle-card good"><b>🟩 Cuerpo verde dominante</b>Compradores controlaron gran parte del período.</div><div class="candle-card good"><b>🟩 Mecha inferior larga</b>Hubo presión vendedora, pero compradores rechazaron precios bajos.</div><div class="candle-card warn"><b>🟥 Cuerpo rojo dominante</b>Vendedores controlaron gran parte del período.</div><div class="candle-card warn"><b>🟥 Mecha superior larga</b>Hubo presión compradora, pero vendedores rechazaron precios altos.</div><div class="candle-card"><b>➕ Cuerpo pequeño / mechas</b>Equilibrio o indecisión relativa: necesitás contexto.</div><div class="candle-card"><b>⚠️ Importante</b>Una vela sola no confirma quién controlará la siguiente.</div></div><div class="candle-rule"><b>Regla Biblia:</b> la vela cuenta la batalla de ese período. La estructura y la ubicación nos dicen cuánto importa esa batalla.</div></div>'}
function structureGame(){return '<div class="case-note"><b>CASO REAL</b> Rango → intento de ruptura → regreso a la resistencia. La pregunta no es “¿sube?”, sino “¿sostiene la salida o vuelve al rango?”.</div><div class="structureGame"><button data-read="Tendencia">📈 Tendencia</button><button data-read="Rango">📦 Rango</button><button data-read="Ruptura">💥 Ruptura</button><button data-read="Retesteo">↩ Retesteo</button></div><div class="explain" id="readText">Elegí qué querés observar.</div>'}
function sketch(){return '<div class="market-sketch"><svg viewBox="0 0 1000 330" preserveAspectRatio="none"><line x1="330" y1="105" x2="650" y2="105" stroke="#a354ff" stroke-width="4"/><line x1="330" y1="245" x2="650" y2="245" stroke="#a354ff" stroke-width="4"/><text x="430" y="88" fill="#c46cff" font-size="27" font-family="Comic Sans MS">RANGO</text><polyline points="20,70 70,105 110,130 150,170 200,205 245,240 290,260 335,225 370,150 410,210 450,135 495,230 540,150 590,215 635,145 675,245 720,215 760,175 800,145 845,105 890,75 940,45" fill="none" stroke="#e9f0f2" stroke-width="4"/><polyline points="25,65 290,265" fill="none" stroke="#ff3f58" stroke-width="4"/><polyline points="680,255 950,45" fill="none" stroke="#18d783" stroke-width="4"/><text x="55" y="245" fill="#fff" font-size="20" font-family="Comic Sans MS">VENDEDORES</text><text x="780" y="270" fill="#fff" font-size="20" font-family="Comic Sans MS">COMPRADORES</text></svg><span class="sticky pink" style="left:9%;top:24%">VENDEDORES</span><span class="sticky lime" style="right:9%;top:35%">COMPRADORES</span></div>'}
function moduleView(idx=0,li=+(localStorage.tbLesson||0)){document.querySelectorAll(".module").forEach((x,i)=>x.classList.toggle("on",i===idx));if(idx!==0){main.innerHTML='<div class="crumb">Inicio › Módulo '+(idx+1)+'</div><div class="placeholder board"><div class="tape-title">MÓDULO '+(idx+1)+'</div><h2>'+mods[idx][0]+'</h2><p>'+mods[idx][1]+'</p><p>Este módulo se construirá con el mismo sistema visual e interactivo.</p><button class="action" onclick="moduleView(0)">Volver al módulo 1</button></div>';return}
main.innerHTML='<div class="crumb">Inicio › Módulo 1 › El Precio Primero</div><div class="hero"><div><span class="tape-title">MÓDULO 1</span><h1>El Precio <em>Primero</em></h1><div class="swash">Antes de mirar cualquier indicador, aprendemos a leer lo más importante: <b>EL PRECIO.</b></div><div class="principle">💡 El precio cuenta qué está haciendo el mercado. Los indicadores ayudan a medirlo.<br><b>Ningún indicador sabe qué va a pasar.</b></div></div><div class="paper"><h3>En este módulo aprenderás:</h3>'+lessons.map(x=>'<p><span class="check">●</span> '+x[0]+'</p>').join("")+'</div></div><div class="progress"><i id="prog"></i></div><div class="tabs">'+lessons.map((x,i)=>'<button data-lesson="'+i+'" class="'+(i===li?'on':'')+'">'+(i+1)+'. '+x[0]+'</button>').join("")+'</div><section class="board">'+lessons.map((x,i)=>'<article class="lesson '+(i===li?'on':'')+'" data-page="'+i+'"><h2><span>1.'+(i+1)+'</span> '+x[0]+'</h2><p>'+x[1]+'</p>'+(i===0?sketch()+structureGame():(i===1?candleLab()+candleReading():'<div class="read-order"><b>👁 Observá primero.</b> Después interpretá. Recién al final decidí si hay algo que hacer.</div>'))+'</article>').join("")+'<div class="lessonnav"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div></section>'+journalHTML();setLesson(li)}
function setLesson(i){i=Math.max(0,Math.min(lessons.length-1,i));localStorage.tbLesson=i;document.querySelectorAll("[data-lesson]").forEach((x,j)=>x.classList.toggle("on",j===i));document.querySelectorAll("[data-page]").forEach((x,j)=>x.classList.toggle("on",j===i));let p=document.getElementById("prog");if(p)p.style.width=((i+1)/lessons.length*100)+"%"}
function journalHTML(){return '<section class="journal" id="journal"><div class="journal-head"><div><h2>📸 Bitácora de operaciones</h2><p>Tu pared de casos reales: capturas, etiquetas y aprendizaje.</p></div></div><div class="drop" id="drop"><input id="shot" type="file" accept="image/*" multiple><div style="font-size:40px">📷 ＋</div><b>ARRASTRÁ TUS CAPTURAS ACÁ</b><br><small>o hacé clic para elegir imágenes</small></div><div class="gallery" id="gallery"></div><div class="privacy">🔒 Se guardan localmente en este navegador. No se publican automáticamente en GitHub.</div></section>'}
function getJ(){try{return JSON.parse(localStorage.tradeJournal||"[]")}catch{return[]}}function saveJ(a){try{localStorage.tradeJournal=JSON.stringify(a)}catch(e){alert("No queda espacio local para más capturas.")}drawJ()}
function addShots(fs){[...fs].filter(f=>f.type.startsWith("image/")).forEach(f=>{let r=new FileReader;r.onload=()=>{let a=getJ();a.unshift({img:r.result,tag:"OPERACIÓN",note:""});saveJ(a)};r.readAsDataURL(f)})}
function drawJ(){let g=document.getElementById("gallery");if(!g)return;g.innerHTML=getJ().map((x,i)=>'<div class="trade"><span class="tag">'+x.tag+'</span><button class="del" data-del="'+i+'">×</button><img src="'+x.img+'"><div class="stickers">'+["✓ PLAN","⚠ TEMPRANO","🏃 TARDE","📦 RANGO","💥 BREAKOUT","🎯 BUENA LECTURA"].map(t=>'<button data-tag="'+t+'" data-i="'+i+'">'+t+'</button>').join("")+'</div><textarea data-note="'+i+'" placeholder="¿Qué viste? ¿Por qué entraste? ¿Qué aprendiste?">'+x.note+'</textarea></div>').join("")}
function initJournal(){let d=document.getElementById("drop"),s=document.getElementById("shot");if(!d)return;d.onclick=()=>s.click();s.onchange=e=>addShots(e.target.files);["dragenter","dragover"].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.add("drag")}));["dragleave","drop"].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.remove("drag")}));d.addEventListener("drop",e=>addShots(e.dataTransfer.files));drawJ()}
function home(){moduleView(0,0)}renderModules();moduleView(0);initJournal();
document.addEventListener("click",e=>{if(e.target.dataset.ohlc){let m={Apertura:"Precio donde comenzó el período de esta vela. No es, por sí solo, una invalidación técnica.",Máximo:"Precio más alto alcanzado durante el período.",Mínimo:"Precio más bajo alcanzado durante el período.",Cierre:"Precio donde terminó el período. Un cierre puede aportar más evidencia que una mecha aislada."};let x=document.getElementById("ohlcText");if(x)x.innerHTML="<b>"+e.target.dataset.ohlc+":</b> "+m[e.target.dataset.ohlc];document.querySelectorAll("[data-ohlc]").forEach(b=>b.classList.toggle("on",b===e.target))}if(e.target.dataset.read){let m={Tendencia:"Buscá la secuencia de máximos y mínimos. No una sola vela.",Rango:"Soporte y resistencia contienen el precio sin progreso direccional claro.",Ruptura:"Salir del límite es información nueva, pero todavía observamos si logra sostenerse.",Retesteo:"El precio vuelve a trabajar una zona recién atravesada. No garantiza continuación."};let x=document.getElementById("readText");if(x)x.innerHTML="<b>"+e.target.dataset.read+":</b> "+m[e.target.dataset.read]};if(e.target.closest(".module")){let i=+e.target.closest(".module").dataset.mod;moduleView(i);initJournal()}if(e.target.dataset.lesson!==undefined)setLesson(+e.target.dataset.lesson);if(e.target.id==="prev")setLesson(+(localStorage.tbLesson||0)-1);if(e.target.id==="next")setLesson(+(localStorage.tbLesson||0)+1);if(e.target.dataset.tag){let a=getJ(),i=+e.target.dataset.i;a[i].tag=e.target.dataset.tag;saveJ(a)}if(e.target.dataset.del!==undefined){let a=getJ();a.splice(+e.target.dataset.del,1);saveJ(a)}if(e.target.dataset.view==="home")home();if(e.target.dataset.view==="module")moduleView(0);if(e.target.dataset.view==="journal"){moduleView(0);setTimeout(()=>{initJournal();document.getElementById("journal")?.scrollIntoView()},30)}if(e.target.dataset.view==="glossary")main.innerHTML='<div class="placeholder board"><h2>Glosario</h2><p><b>Rango:</b> zona donde el precio oscila sin progreso direccional claro.</p><p><b>Invalidación:</b> condición que demuestra que la tesis dejó de sostenerse.</p><p><b>Momentum:</b> intensidad del movimiento reciente.</p><h3 class="chalk">Velas — lectura rápida</h3><div class="gloss-candles"><div class="gc green"><div class="mini full"><i></i><b></b></div><span><b>Verde dominante</b></span><small>Compradores dominaron gran parte del período.</small></div><div class="gc green"><div class="mini lower"><i></i><b></b></div><span><b>Mecha inferior larga</b></span><small>Rechazo de precios bajos; compradores respondieron.</small></div><div class="gc red"><div class="mini full"><i></i><b></b></div><span><b>Roja dominante</b></span><small>Vendedores dominaron gran parte del período.</small></div><div class="gc red"><div class="mini upper"><i></i><b></b></div><span><b>Mecha superior larga</b></span><small>Rechazo de precios altos; vendedores respondieron.</small></div><div class="gc"><div class="mini doji"><i></i><b></b></div><span><b>Cuerpo pequeño / Doji</b></span><small>Equilibrio o indecisión relativa. Necesita contexto.</small></div></div><div class="gloss-note"><b>Recordatorio:</b> una vela cuenta qué pasó durante ese período; sola no predice la siguiente. Mirá estructura + ubicación.</div></div>';if(e.target.dataset.view==="notes")main.innerHTML='<div class="placeholder board"><h2>Mis notas</h2><textarea id="notes" style="width:100%;min-height:350px;background:#071116;color:white;border:1px solid #38505a;padding:16px" placeholder="Escribí acá...">'+(localStorage.tbNotes||"")+'</textarea></div>'});
document.addEventListener("input",e=>{if(e.target.dataset.note!==undefined){let a=getJ();a[+e.target.dataset.note].note=e.target.value;localStorage.tradeJournal=JSON.stringify(a)}if(e.target.id==="notes")localStorage.tbNotes=e.target.value});
homeBtn.onclick=home;
</script></body></html>
